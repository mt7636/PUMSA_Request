<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funding Request — PUMSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a href="member.html" class="word">PUMSA <span>Funding</span></a>
  <div class="who">
    <span id="whoName"></span>
    <button class="btn-ghost" style="cursor:pointer; font-family:var(--sans); font-size:0.8rem;" onclick="Session_.logout()">Log out</button>
  </div>
</div>

<div class="wrap">
  <div style="margin-top:8px; margin-bottom:20px;">
    <a href="member.html" class="small">← Back to my requests</a>
  </div>

  <h1 id="pageTitle">New funding request</h1>

  <div id="errorBox" class="error-box" style="display:none;"></div>
  <div id="lockedBox" class="info-box" style="display:none;"></div>

  <div class="card" style="margin-bottom:20px;">
    <div class="field">
      <label for="eventName">Event name</label>
      <input type="text" id="eventName" placeholder="e.g. Eid Banquet">
    </div>

    <div class="row3">
      <div class="field">
        <label for="eventDate">Event date</label>
        <input type="date" id="eventDate">
      </div>
      <div class="field">
        <label for="startTime">Start time</label>
        <input type="time" id="startTime">
      </div>
      <div class="field">
        <label for="endTime">End time</label>
        <input type="time" id="endTime">
      </div>
    </div>

    <div id="deadlinePreview" class="info-box" style="display:none;"></div>

    <div class="row3">
      <div class="field">
        <label for="estAttendance">Estimated attendance</label>
        <input type="number" id="estAttendance" min="1" step="1" placeholder="e.g. 80">
      </div>
      <div class="field" style="grid-column: span 2;">
        <label for="location">Location</label>
        <input type="text" id="location" placeholder="e.g. Frist Multipurpose Room">
      </div>
    </div>

    <div class="field">
      <label class="checkbox-label" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="locationReserved" style="width:auto;">
        <span>Location has been reserved</span>
      </label>
    </div>

    <div class="field">
      <label for="schedule">Approximate schedule</label>
      <textarea id="schedule" placeholder="e.g. 6:00 doors open, 6:30 dinner, 7:15 speaker, 8:00 close"></textarea>
    </div>

    <div class="field">
      <label for="agenda">Agenda</label>
      <textarea id="agenda" placeholder="What's the purpose and content of the event?"></textarea>
    </div>

    <div class="field">
      <label>Itemized costs</label>
      <div class="item-header" aria-hidden="true">
        <span>Item</span><span>Qty</span><span>Cost / item</span><span>Total</span><span></span>
      </div>
      <div id="itemRows"></div>
      <button class="btn btn-outline" id="addItemBtn" type="button" style="margin-top:6px;">+ Add item</button>
      <div class="item-total"><span>Total</span><span class="amt" id="itemTotal">$0.00</span></div>
      <div class="hint">Enter the item name, quantity, and cost per item. The line total and request total are calculated automatically.</div>
    </div>

    <button class="btn btn-primary btn-full" id="saveBtn">Save request</button>
  </div>

  <div class="card" id="photoCard" style="display:none;">
    <h3>Event photo</h3>
    <p class="small">Once the event has happened, upload a photo here for the record.</p>
    <div id="existingPhoto"></div>
    <input type="file" id="photoInput" accept="image/*" style="margin-top:10px;">
    <button class="btn btn-outline" id="uploadBtn" style="margin-top:10px;">Upload photo</button>
  </div>

  <div class="card" id="deleteCard" style="display:none; margin-top:20px;">
    <button class="btn btn-danger btn-full" id="deleteBtn">Delete this request</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/funding-rules.js"></script>
<script>
const session = Session_.requireMember();
document.getElementById('whoName').textContent = session.name + ' (' + session.code + ')';

const params = new URLSearchParams(window.location.search);
const requestId = params.get('id');

let items = [{ name: '', quantity: '', unitCost: '' }];
let existing = null;
let editable = true;

function showError(msg) { const e = document.getElementById('errorBox'); e.textContent = msg; e.style.display = 'block'; }

// ---------- Itemized cost rows ----------

function itemLineTotal(it) {
  return Math.round(((Number(it.quantity) || 0) * (Number(it.unitCost) || 0)) * 100) / 100;
}

function renderItemRows() {
  const el = document.getElementById('itemRows');
  el.innerHTML = items.map((it, i) => `
    <div class="item-row">
      <input type="text" placeholder="Item" data-idx="${i}" class="item-name" value="${escapeHtml(it.name)}" ${editable ? '' : 'disabled'}>
      <input type="number" placeholder="Qty" min="1" step="1" data-idx="${i}" class="item-qty" value="${it.quantity}" ${editable ? '' : 'disabled'}>
      <input type="number" placeholder="0.00" min="0" step="0.01" data-idx="${i}" class="item-unit-cost" value="${it.unitCost}" ${editable ? '' : 'disabled'}>
      <span class="item-line-total mono">${fmtMoney(itemLineTotal(it))}</span>
      <button type="button" class="btn-ghost" data-idx="${i}" onclick="removeItem(${i})" ${editable ? '' : 'disabled'} style="cursor:pointer;">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.item-name').forEach(inp => inp.addEventListener('input', e => { items[e.target.dataset.idx].name = e.target.value; }));
  el.querySelectorAll('.item-qty').forEach(inp => inp.addEventListener('input', e => { items[e.target.dataset.idx].quantity = e.target.value; updateTotal(); }));
  el.querySelectorAll('.item-unit-cost').forEach(inp => inp.addEventListener('input', e => { items[e.target.dataset.idx].unitCost = e.target.value; updateTotal(); }));
  updateTotal();
}

function removeItem(i) {
  if (items.length === 1) return;
  items.splice(i, 1);
  renderItemRows();
}

function addItem() { items.push({ name: '', quantity: '', unitCost: '' }); renderItemRows(); }

function currentTotal() { return Math.round(items.reduce((s, it) => s + itemLineTotal(it), 0) * 100) / 100; }

function updateTotal() {
  document.querySelectorAll('.item-line-total').forEach((el, i) => { el.textContent = fmtMoney(itemLineTotal(items[i])); });
  document.getElementById('itemTotal').textContent = fmtMoney(currentTotal());
  updateDeadlinePreview();
}

function fmtMoney(n) { return '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

// ---------- Deadline preview ----------

function updateDeadlinePreview() {
  const box = document.getElementById('deadlinePreview');
  const dateVal = document.getElementById('eventDate').value;
  if (!dateVal) { box.style.display = 'none'; return; }
  const info = computeDeadlineInfo(dateVal, currentTotal());
  box.style.display = 'block';
  if (info.tooLate) {
    box.className = 'error-box';
    box.textContent = `This event may be too soon for Projects Board's standard lead time (${info.leadWeeks} weeks after the meeting for a ${fmtMoney(currentTotal())} request). Contact Projects Board directly, or pick a later date.`;
  } else {
    box.className = 'info-box';
    box.textContent = `Submit by ${fmtDateTime(info.deadline)} to be considered at the ${fmtDate(info.meetingDate)} Projects Board meeting.`;
  }
}

// ---------- Load existing (edit/view mode) ----------

async function loadExisting() {
  try {
    const res = await callApi('getMyRequests', { code: session.code });
    existing = res.requests.find(r => r.id === requestId);
    if (!existing) { showError('Request not found.'); return; }

    document.getElementById('pageTitle').textContent = existing.eventName;
    document.getElementById('eventName').value = existing.eventName;
    document.getElementById('eventDate').value = existing.eventDate;
    document.getElementById('startTime').value = existing.startTime;
    document.getElementById('endTime').value = existing.endTime;
    document.getElementById('estAttendance').value = existing.estAttendance || '';
    document.getElementById('location').value = existing.location || '';
    document.getElementById('locationReserved').checked = !!existing.locationReserved;
    document.getElementById('schedule').value = existing.schedule || '';
    document.getElementById('agenda').value = existing.agenda;
    items = existing.items.length ? existing.items.map(it => ({
      name: it.name || it.desc || '',
      quantity: it.quantity == null || it.quantity === '' ? 1 : it.quantity,
      unitCost: it.unitCost == null || it.unitCost === '' ? (it.amount || 0) : it.unitCost
    })) : [{ name: '', quantity: '', unitCost: '' }];

    editable = existing.status === 'Not Yet Requested';
    if (!editable) {
      document.getElementById('lockedBox').style.display = 'block';
      document.getElementById('lockedBox').textContent = `This request is "${existing.status}" and can no longer be edited.`;
      document.getElementById('eventName').disabled = true;
      document.getElementById('eventDate').disabled = true;
      document.getElementById('startTime').disabled = true;
      document.getElementById('endTime').disabled = true;
      document.getElementById('estAttendance').disabled = true;
      document.getElementById('location').disabled = true;
      document.getElementById('locationReserved').disabled = true;
      document.getElementById('schedule').disabled = true;
      document.getElementById('agenda').disabled = true;
      document.getElementById('saveBtn').style.display = 'none';
    } else {
      document.getElementById('deleteCard').style.display = 'block';
    }

    renderItemRows();
    updateDeadlinePreview();
    setupPhotoSection();
  } catch (e) {
    showError(e.message);
  }
}

// ---------- Photo upload ----------

function setupPhotoSection() {
  if (!existing) return;
  const eventDate = new Date(existing.eventDate + 'T00:00:00');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (eventDate >= today) return; // event hasn't happened yet

  document.getElementById('photoCard').style.display = 'block';
  if (existing.photoUrl) {
    document.getElementById('existingPhoto').innerHTML = `<p class="small">Photo already uploaded:</p><a href="${existing.photoUrl}" target="_blank" rel="noopener">${existing.photoUrl}</a>`;
  }
}

document.getElementById('uploadBtn').onclick = async () => {
  const file = document.getElementById('photoInput').files[0];
  if (!file) return showError('Choose a photo first.');
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  try {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const res = await callApi('uploadPhoto', { code: session.code, id: requestId, dataUrl });
    document.getElementById('existingPhoto').innerHTML = `<p class="small">Uploaded!</p><a href="${res.photoUrl}" target="_blank" rel="noopener">${res.photoUrl}</a>`;
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Upload photo';
  }
};

// ---------- Save / delete ----------

async function save() {
  const eventName = document.getElementById('eventName').value.trim();
  const eventDate = document.getElementById('eventDate').value;
  const startTime = document.getElementById('startTime').value;
  const endTime = document.getElementById('endTime').value;
  const estAttendance = document.getElementById('estAttendance').value;
  const location = document.getElementById('location').value.trim();
  const locationReserved = document.getElementById('locationReserved').checked;
  const schedule = document.getElementById('schedule').value.trim();
  const agenda = document.getElementById('agenda').value.trim();
  const cleanItems = items.filter(it => it.name.trim() !== '' || it.quantity !== '' || it.unitCost !== '').map(it => ({
    name: it.name.trim(),
    quantity: Number(it.quantity),
    unitCost: Number(it.unitCost)
  }));

  if (!eventName || !eventDate || !startTime || !endTime) return showError('Fill in the event name, date, and start/end time.');
  if (!estAttendance || Number(estAttendance) <= 0) return showError('Enter an estimated attendance.');
  if (!location) return showError('Enter a location.');
  if (!cleanItems.length) return showError('Add at least one itemized cost.');
  for (const it of cleanItems) {
    if (!it.name) return showError('Every itemized cost needs an item name.');
    if (!Number.isInteger(it.quantity) || it.quantity <= 0) return showError('Each item quantity must be a positive whole number.');
    if (!Number.isFinite(it.unitCost) || it.unitCost < 0) return showError('Each cost per item must be a nonnegative number.');
  }

  const payload = {
    code: session.code, eventName, eventDate, startTime, endTime,
    estAttendance: Number(estAttendance), location, locationReserved, schedule, agenda,
    items: cleanItems,
  };

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    if (requestId) {
      await callApi('updateRequest', Object.assign({ id: requestId }, payload));
    } else {
      await callApi('submitRequest', payload);
    }
    window.location.href = 'member.html';
  } catch (e) {
    showError(e.message);
    btn.disabled = false; btn.textContent = 'Save request';
  }
}

document.getElementById('deleteBtn').onclick = async () => {
  if (!confirm('Delete this request? This cannot be undone.')) return;
  try {
    await callApi('deleteRequest', { code: session.code, id: requestId });
    window.location.href = 'member.html';
  } catch (e) {
    showError(e.message);
  }
};

document.getElementById('addItemBtn').onclick = addItem;
document.getElementById('saveBtn').onclick = save;
['eventDate', 'startTime', 'endTime'].forEach(id => document.getElementById(id).addEventListener('input', updateDeadlinePreview));

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// ---------- Init ----------

if (requestId) {
  loadExisting();
} else {
  renderItemRows();
}
</script>
</body>
</html>
